services:
  neo4j:
    image: neo4j:5.14-community
    container_name: neo4j_kg
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-12345678}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/plugins:/plugins
    healthcheck:
      # cypher-shell ships with the image; compose substitutes NEO4J_PASSWORD
      # at parse time (keep it in sync with NEO4J_AUTH above).
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-12345678} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - kg_network
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.4.18
    container_name: chromadb_kg
    # The stock image entrypoint runs `pip install --force-reinstall
    # chroma-hnswlib` on EVERY start — today's chroma-hnswlib pulls in
    # numpy 2.x, which removed np.float_ and crashes chromadb 0.4.18 at
    # import. Bypass the entrypoint and run uvicorn directly with the
    # image's own (working) hnswlib build; same args as the original.
    entrypoint: ["/usr/local/bin/uvicorn"]
    command:
      - "chromadb.app:app"
      - "--workers"
      - "1"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--proxy-headers"
      - "--log-config"
      - "chromadb/log_config.yml"
      - "--timeout-keep-alive"
      - "30"
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - ./data/chromadb:/chroma/chroma
    healthcheck:
      # The image is python-based (no curl/wget guaranteed); heartbeat is the
      # documented liveness endpoint.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - kg_network
    restart: unless-stopped

networks:
  kg_network:
    driver: bridge
